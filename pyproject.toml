[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpcheck"
version = "0.1.0"
description = "Conformance and fuzz checks for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcpcheck contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "conformance",
    "fuzz",
    "json-rpc",
    "testing",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Coisini-cyber/mcpcheck"
Issues = "https://github.com/Coisini-cyber/mcpcheck/issues"

[project.scripts]
mcpcheck = "mcpcheck.cli:main"

[tool.setuptools]
packages = ["mcpcheck"]
